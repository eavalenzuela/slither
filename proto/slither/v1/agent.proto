// Agent↔Server session service.
syntax = "proto3";

package slither.v1;

import "slither/v1/common.proto";
import "slither/v1/control.proto";
import "google/protobuf/timestamp.proto";

// AgentService is the long-lived session between a single agent and the server.
service AgentService {
  // Enroll exchanges a single-use enrollment token for a per-host client cert.
  // Called once by unenrolled agents; subsequent connections use mTLS.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Session is a bidirectional stream. Agent emits events and heartbeats;
  // server emits control messages (ruleset updates, response requests, hunt queries).
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

message EnrollRequest {
  // Single-use token issued by an operator via the server admin UI.
  string enrollment_token = 1;

  // PEM-encoded CSR. Server signs it with the slither CA, returns the cert.
  bytes csr_pem = 2;

  // Agent-provided host fingerprint — hostname, machine-id, os-release.
  HostFingerprint fingerprint = 3;
}

message EnrollResponse {
  // PEM-encoded client cert signed by the slither CA.
  bytes client_cert_pem = 1;

  // PEM-encoded CA cert chain for verifying the server.
  bytes ca_cert_pem = 2;

  // Stable host_id assigned by server; agent stores this to disk.
  string host_id = 3;
}

message HostFingerprint {
  string hostname = 1;
  string machine_id = 2;     // /etc/machine-id
  string os_name = 3;        // /etc/os-release ID
  string os_version = 4;     // /etc/os-release VERSION_ID
  string kernel_version = 5; // uname -r
  string arch = 6;           // amd64, arm64
}

// ClientMessage is the union of everything an agent may send during Session.
message ClientMessage {
  oneof kind {
    Envelope event = 1;
    Heartbeat heartbeat = 2;
    Ack ack = 3;
    DiagReport diag = 4;
    // Phase 4 #73: response result corresponding to a server-issued
    // ResponseRequest. Additive within slither.v1; v0 agents that
    // don't know the field never emit it.
    ResponseResult response_result = 5;
    // Phase 6 #110: one chunk of a live-query hunt response. Additive
    // within slither.v1; v0 agents never emit. Multiple hunt_result
    // messages flow per HuntQuery — any number carrying rows then
    // exactly one carrying complete.
    HuntResult hunt_result = 6;
    // Phase 6 #112: tamper-chain summary — emitted every 5 minutes
    // by the agent's selfprotect ChainWriter so the server can
    // cross-check against equivalent pg/CH rows for that host +
    // window. Additive within slither.v1; v0 agents never emit.
    ChainSummary chain_summary = 7;
  }
}

// ChainSummary is one periodic snapshot of the agent's tamper-evident
// chain (Phase 5 #95). Phase 6 #112 added the count-based cross-check;
// Phase 7 / ADR-0042 added `links`, which upgrades the check from
// count-level to record-level.
//
// The server still does NOT recompute `record_hash` — the canonical
// hash input includes a local wall-clock TS the server cannot
// reconstruct, and ADR-0042 deliberately keeps it hashed so on-agent
// back-dating stays detectable. Instead the server persists the links
// and becomes an independent append-only *witness* of the chain: it
// replays linkage, refuses a contradicted record_hash for a seq it has
// already seen, and anchors continuity on prev_hash across summary
// boundaries and agent restarts alike.
//
// `count` is the number of records appended since `since`, not the
// total chain length — keeps a long-running agent's summary cheap.
// Server compares this against equivalent rows in pg.response_actions
// + ClickHouse detection_findings for (host_id, since..now); a delta
// fires a `chain.mismatch` audit event with severity 4 (high).
message ChainSummary {
  // last_seq is the seq of the most recent record the agent appended.
  // Monotonic-ish across restarts (recover() resumes from the last
  // good record's seq+1).
  uint64 last_seq = 1;

  // last_hash is the hex sha256 of the most recent record. Opaque to
  // the server in Phase 6 — stored verbatim for forensic comparison.
  string last_hash = 2;

  // count is the number of `response_action` + `detection_finding`
  // records the agent appended in the [since, now) window. The
  // synthetic `chain.init` anchor is excluded — server-side rows
  // don't have an equivalent.
  uint64 count = 3;

  // since is the start of the window the count covers. Set to the
  // last successfully-acknowledged summary's timestamp on subsequent
  // runs; on first run after agent boot it equals chain-init time.
  google.protobuf.Timestamp since = 4;

  // observed_at is the agent wall-clock at summary build time —
  // the [since, observed_at) window the server compares against.
  google.protobuf.Timestamp observed_at = 5;

  // links carries one entry per chain record the agent holds for this
  // window, ascending by seq. Additive within slither.v1 (ADR-0011):
  // a pre-ADR-0042 agent never emits it, and the server treats an
  // empty list as "count-only agent" rather than as a mismatch.
  //
  // Unlike `count`, links INCLUDE the synthetic `chain.init` anchor —
  // it is a real chain record at seq=0 and the server needs it to
  // verify the very first link's prev_hash against the zero sentinel.
  // The window is also re-seeded from disk on agent restart, so a
  // restart re-reports links the server has already witnessed; those
  // are verified for equality and then ignored, not double-counted.
  repeated ChainLink links = 6;

  // links_truncated is set when the window produced more links than
  // the agent's bounded buffer holds. The buffer keeps the most recent
  // links, so the TAIL is always accurate (which is what the server
  // anchors on) and the gap is at the head. The server records the
  // truncation instead of reporting the head gap as an unexplained
  // sequence hole.
  bool links_truncated = 7;
}

// ChainLink is one hash-chain record's identity with its content
// stripped — enough to replay linkage, not enough to leak what the
// record was about. Phase 7 / ADR-0042.
message ChainLink {
  // seq is the record's position in the chain. Contiguous from 0.
  uint64 seq = 1;

  // kind is the record kind (`chain.init`, `response_action`,
  // `detection_finding`). Carried for operator forensics — the server
  // does not key any verification on it.
  string kind = 2;

  // prev_hash is the preceding record's record_hash, or 64 zeros for
  // seq=0.
  string prev_hash = 3;

  // record_hash is the hex sha256 of this record's canonical input.
  // Opaque to the server: it is compared, never recomputed.
  string record_hash = 4;
}

// ServerMessage is the union of everything a server may send during Session.
message ServerMessage {
  oneof kind {
    RuleSet rule_set = 1;
    ResponseRequest response_request = 2;
    HuntQuery hunt_query = 3;           // Phase 6; skeleton for v1 freeze
    ConfigUpdate config_update = 4;
    // Phase 4 #73: per-host response policy (ADR-0034). Pushed once
    // on Session open and on every policy edit — the agent caches
    // it for the auto-respond gate. v0 agents ignore.
    HostPolicy host_policy = 5;
    // Phase 5 #97: end-to-end backpressure. Server broadcasts when
    // its CH writer falls behind; agent caches the latest signal
    // and consults it from the sampling decision in low-priority
    // collectors. Additive — v0 agents ignore.
    BackpressureSignal backpressure = 6;
  }
}

// BackpressureSignal advertises the current load level the server
// is willing to absorb. Phase 5 #97. Agents respect the signal until
// a follow-up signal arrives or 5 minutes elapse (whichever first).
message BackpressureSignal {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_NORMAL      = 1;  // back to baseline; agents stop sampling
    LEVEL_ELEVATED    = 2;  // ~50% drop on low-priority classes
    LEVEL_CRITICAL    = 3;  // ~90% drop on low-priority classes
  }
  Level level = 1;
  // observed_drop_rate is the server's recent subscriber drop_rate_pct
  // expressed as a fraction (0.0–1.0). Informational; the agent's
  // sampling math reads `level` not this field.
  float observed_drop_rate = 2;
  // since is when the server transitioned into this level.
  google.protobuf.Timestamp since = 3;
}

// DiagReport is a periodic or on-demand snapshot of agent internals.
// Sent on shutdown with cumulative counters; on-demand when the server
// requests via ConfigUpdate.diag_request.
message DiagReport {
  string host_id = 1;
  AgentHealth health = 2;
  repeated string warnings = 3;
}

title: SSH password brute force from one source
id: 8b7c4d00-0001-4000-8000-000000000050
status: experimental
description: |
  More than five failed sshd credential checks from the same remote
  host inside 60 seconds. T1110.001 (Brute Force: Password Guessing)
  and T1110.003 (Password Spraying) both look like this from the
  target's side; the rule keys on RemoteHost so a spray across many
  usernames from one box still counts as one burst.

  Only password / keyboard-interactive attempts reach PAM — a rejected
  public key never does — so this is specifically the password
  brute-force signal. Key-based guessing is invisible here by sshd's
  design and is better caught at the network layer (many short-lived
  TCP accepts on 22 from one peer).

  Bounded-stateful and edge-eligible: one counter per remote host, 60 s
  window, well under the 300 s cap.
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
  - attack.t1110.003
logsource:
  product: linux
  category: authentication
detection:
  failed_ssh_auth:
    Service: sshd
    EventCode: auth_attempt
    Status: Failure
  condition: failed_ssh_auth | count() by RemoteHost > 5
timeframe: 60s
